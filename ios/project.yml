name: GiftWallet
options:
  bundleIdPrefix: com.shmuel2023
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GiftWallet:
    type: application
    platform: iOS
    sources:
      - path: GiftWallet
      # seed data so the app works offline on first launch;
      # newer data is downloaded from GitHub at runtime
      - path: ../data/merchants.json
        buildPhase: resources
      - path: ../data/cards.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shmuel2023.giftwallet
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: GiftWallet/Info.plist
      properties:
        CFBundleDisplayName: השוברים שלי
        CFBundleDevelopmentRegion: he
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: כדי להראות חנויות קרובות שמכבדות את הכרטיסים שלך.
        NSLocationAlwaysAndWhenInUseUsageDescription: כדי להתריע כשאת/ה ליד חנות עם מוצר מהרשימה או שובר שמחכה למימוש, גם כשהאפליקציה סגורה.
